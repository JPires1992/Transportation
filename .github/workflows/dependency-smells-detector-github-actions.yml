# Example GitHub Actions workflow.
# Copy this file to .github/workflows/dependency-smells-detector.yml to run it.

name: Dependency Smells Detector

on:
  workflow_dispatch:
    inputs:
      detector_repository:
        description: "Repository that contains the dependency-smells-detector backend."
        required: true
        default: "JPires1992/dependency-smells-detector"
      detector_ref:
        description: "Branch, tag, or commit SHA of the detector repository."
        required: true
        default: "main"
      target:
        description: "GitHub repository to analyse, in owner/repo format."
        required: true
        default: "JPires1992/Transportation"
      ref:
        description: "Branch, tag, or commit SHA to analyse."
        required: true
        default: "main"
      dirty_waters_timeout_ms:
        description: "Dirty-Waters timeout in milliseconds."
        required: true
        default: "3600000"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout detector repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.detector_repository }}
          ref: ${{ inputs.detector_ref }}
          path: detector

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare artefact directory
        run: mkdir -p detector/backend/reports

      - name: Install backend dependencies
        working-directory: detector/backend
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a reports/workflow.log

      - name: Prepare Python packaging
        working-directory: detector/backend
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee -a reports/workflow.log

      - name: Run dependency smell analysis
        working-directory: detector/backend
        env:
          GITHUB_API_TOKEN: ${{ secrets.API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          export GITHUB_API_TOKEN="${GITHUB_API_TOKEN:-$GITHUB_TOKEN}"

          args=(
            --
            --target "${{ inputs.target }}"
            --ref "${{ inputs.ref }}"
            --output reports
            --dirty-waters-timeout-ms "${{ inputs.dirty_waters_timeout_ms }}"
          )

          npm run analyze "${args[@]}" 2>&1 | tee -a reports/workflow.log

      - name: Upload analysis artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-smells-results
          path: detector/backend/reports/**
          if-no-files-found: warn
          retention-days: 30
