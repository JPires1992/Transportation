version: '3.8'

services:
  # MySQL Database for Users and Vehicles (buses - relational data)
  mysql:
    image: mysql:8.0
    container_name: tabdd_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tabdd
      MYSQL_USER: tabdd_user
      MYSQL_PASSWORD: tabdd_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache for key-value storage (e.g., sessions, tokens)
  redis:
    image: redis:7-alpine
    container_name: tabdd_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Commander - web UI to explore Redis keys (binds to localhost)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tabdd_redis_commander
    restart: always
    ports:
      # bind to localhost to avoid exposing to the network
      - "127.0.0.1:8081:8081"
    environment:
      # connect to the 'redis' service created by this compose file
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # MongoDB - Document database for User history and vehicles history
  mongo:
    image: mongo:8
    container_name: tabdd_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: tabdd
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j - Graph database for routes and stop connections
  neo4j:
    image: neo4j:5
    container_name: tabdd_neo4j
    restart: always
    environment:
      NEO4J_AUTH: "neo4j/neo4j_pass"
    ports:
      - "7474:7474" # HTTP (browser)
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_pass 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabdd_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: tabdd_user
      DB_PASSWORD: tabdd_pass
      DB_NAME: tabdd
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: tabdd
      MONGO_USERNAME: mongo_user
      MONGO_PASSWORD: mongo_pass
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_pass
      NODE_ENV: development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend (Simple HTML/JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tabdd_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  neo4j_data:

